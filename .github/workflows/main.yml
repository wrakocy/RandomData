name: main

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  BUILD_CONFIGURATION: Release

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore Solution
        run: dotnet restore Wrak.RandomData.slnx

      - name: Verify Pinned Package Versions
        shell: pwsh
        run: ./Verify-Package-Versions.ps1

      - name: Build Solution
        run: dotnet build Wrak.RandomData.slnx --configuration $BUILD_CONFIGURATION -p:SourceRevisionId=${{ github.sha }}

      - name: Run Tests
        run: >
          dotnet test Wrak.RandomData.slnx
          --configuration $BUILD_CONFIGURATION
          --no-build
          --report-trx
          --results-directory ${{ runner.temp }}/TestResults
      - name: Publish Test Results
        uses: dorny/test-reporter@v3
        if: success() || failure()
        # dorny/test-reporter's trx parser throws on a .trx with 0 or 1 UnitTest entries
        # (e.g. an as-yet-empty test project in this template) — annotation only, so
        # don't let a parser bug fail the run; the "Run Tests" step above is the real gate.
        continue-on-error: true
        with:
          name: Test Results
          path: '${{ runner.temp }}/TestResults/*.trx'
          reporter: dotnet-trx
