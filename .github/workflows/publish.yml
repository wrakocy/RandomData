name: Publish to NuGet

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      version:
        description: "Package version to publish (e.g. 3.4.0) — must match a version the user has explicitly confirmed"
        required: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # Bound to "release" for NUGET_USER (an environment secret, not a repo
    # secret) — required reviewers on this environment can still be added
    # under repo Settings > Environments for an approval gate.
    environment: release
    permissions:
      contents: read
      id-token: write # required for NuGet Trusted Publishing (OIDC)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Verify formatting
        run: dotnet format Wrak.RandomData.sln --verify-no-changes

      - name: Build
        run: dotnet build Wrak.RandomData.sln -c Release

      - name: Test
        run: dotnet test Wrak.RandomData.Tests/Wrak.RandomData.Tests.csproj -c Release --no-build

      - name: Pack
        run: dotnet pack Wrak.RandomData.sln -c Release -p:Version=${{ steps.version.outputs.version }} -o artifacts

      - name: NuGet login (OIDC -> short-lived API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet.org
        run: dotnet nuget push "artifacts/*.nupkg" --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json
